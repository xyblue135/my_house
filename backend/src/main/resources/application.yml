server:
  address: ${MYHOUSE_BIND_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:10100}

spring:
  application:
    name: myhouse
  jackson:
    default-property-inclusion: non_null
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
  servlet:
    multipart:
      # 恢复云备份时需要上传 SQLite 库与大图片
      max-file-size: 512MB
      max-request-size: 512MB

myhouse:
  data-dir: ${MYHOUSE_DATA_DIR:../data}
  # 家庭账号登录（连接页用账号密码换会话令牌）。仅在数据目录没有 account.json 时生效。
  auth-username: ${MYHOUSE_AUTH_USERNAME:}
  auth-password: ${MYHOUSE_AUTH_PASSWORD:}
  rabbitmq:
    enabled: ${MYHOUSE_RABBITMQ_ENABLED:false}
    url: ${MYHOUSE_RABBITMQ_URL:amqp://guest:guest@127.0.0.1/}
    exchange: ${MYHOUSE_RABBITMQ_EXCHANGE:myhouse.events}
    queue: ${MYHOUSE_RABBITMQ_QUEUE:myhouse.inventory.events}
    worker-enabled: ${MYHOUSE_RABBITMQ_WORKER_ENABLED:false}

logging:
  level:
    com.xyblue.myhouse: INFO
    # 需要排查时可临时打开：
    # com.xyblue.myhouse.repository: DEBUG
    # com.xyblue.myhouse.service: DEBUG
