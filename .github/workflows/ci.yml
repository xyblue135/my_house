name: CI

# 每次提交/PR 都先过测试与构建，避免把跑不起来的东西推到 master
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 手机端（Vue + Capacitor）：版本号一致性 → 单测 → 类型检查 + 打包
  frontend:
    name: 手机端 测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 版本号一致性（package.json / versionName / versionCode）
        run: node scripts/check-version.mjs

      - name: 安装依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 单元测试
        working-directory: frontend
        run: pnpm test

      - name: 类型检查 + 构建
        working-directory: frontend
        run: pnpm build

      - name: 上传 Web 产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
          retention-days: 7

  # 电脑端（Spring Boot）：编译 + 测试
  backend:
    name: 电脑端 编译与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: mvn verify
        working-directory: backend
        run: mvn -B -ntp verify

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7
          if-no-files-found: ignore
