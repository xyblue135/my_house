name: Build APK

# 打包流水线：
#   - 推到 master / 手动触发 → 构建 debug APK，作为 Actions 产物（自用安装）
#   - 打 v* 标签 → 构建「正式签名」APK 并发布到 Releases（App 内「检查更新」读的就是它）
# 版本号必须三处一致，见 scripts/check-version.mjs；标签必须与版本号一致。
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: 构建 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 版本号一致性检查
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            node scripts/check-version.mjs "${GITHUB_REF_NAME}"
          else
            node scripts/check-version.mjs
          fi

      - name: 安装依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 测试
        working-directory: frontend
        run: pnpm test

      - name: 构建 Web
        working-directory: frontend
        run: pnpm build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: 同步 Capacitor
        working-directory: frontend
        run: pnpm exec cap sync android

      - name: 接受 Android 许可
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: 构建 Debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: 上传 Debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: my-house-apk-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ---- 以下只在打 v* 标签时执行：正式签名 + 发布 ----
      - name: 检查签名密钥是否已配置
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 密钥，无法产出正式签名 APK（否则会退回随机 debug 证书，用户升级时签名不一致装不上）"
            exit 1
          fi

      - name: 解码签名证书
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > frontend/android/release.keystore

      - name: 构建 Release APK（正式签名）
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: frontend/android
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: 校验签名（打印证书指纹，跨版本必须一致）
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: frontend/android
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort | tail -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "SHA-256"

      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
